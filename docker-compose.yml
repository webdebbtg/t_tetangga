version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: tt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tengok_tetangga}
      POSTGRES_USER: ${DB_USERNAME:-tt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tt_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - tt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tt_user} -d ${DB_DATABASE:-tengok_tetangga}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tt_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-tt_redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - tt_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible Object Storage) ───────────────
  minio:
    image: minio/minio:latest
    container_name: tt_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tt_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tt_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - tt_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Laravel Backend (PHP-FPM) ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tt_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-tengok_tetangga}
      DB_USERNAME: ${DB_USERNAME:-tt_user}
      DB_PASSWORD: ${DB_PASSWORD:-tt_password}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-tt_redis_secret}
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tt_minio_user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-tt_minio_secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-tengok-tetangga}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/auth/google/callback}
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE_URL: http://ai-service:8001
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - tt_network

  # ── Nginx (Backend Reverse Proxy) ────────────────────
  nginx:
    image: nginx:alpine
    container_name: tt_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tt_network

  # ── Laravel Queue Worker ────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tt_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-tengok_tetangga}
      DB_USERNAME: ${DB_USERNAME:-tt_user}
      DB_PASSWORD: ${DB_PASSWORD:-tt_password}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-tt_redis_secret}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - app
      - redis
    networks:
      - tt_network

  # ── Laravel Scheduler ──────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tt_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-tengok_tetangga}
      DB_USERNAME: ${DB_USERNAME:-tt_user}
      DB_PASSWORD: ${DB_PASSWORD:-tt_password}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-tt_redis_secret}
      REDIS_PORT: 6379
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - app
      - db
    networks:
      - tt_network

  # ── Python AI / NLP Service ───────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: tt_ai
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8001:8001"
    networks:
      - tt_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js Frontend ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tt_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      NEXT_PUBLIC_APP_NAME: "Tengok Tetangga"
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    networks:
      - tt_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  tt_network:
    driver: bridge
