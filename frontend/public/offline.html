<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tidak Ada Koneksi — Tengok Tetangga</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #F0FDF4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.375rem; font-weight: 800; color: #14532D; margin-bottom: 0.75rem; }
    p  { color: #6B7280; line-height: 1.7; font-size: 0.9375rem; margin-bottom: 1.75rem; }
    button {
      background: #16A34A;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 2rem;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #15803D; }
    .tip {
      margin-top: 1.5rem;
      font-size: 0.8125rem;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>
      Sepertinya Anda sedang offline. Periksa koneksi internet Anda dan coba lagi.
    </p>
    <button onclick="window.location.reload()">
      🔄 Coba Lagi
    </button>
    <p class="tip">Beberapa halaman mungkin tersedia dalam mode offline</p>
  </div>
</body>
</html>
